<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0f14" />
    <title>Offline · Poyino</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0f14;
        --surface: #121820;
        --text: #e8eef4;
        --muted: #93a0b0;
        --primary: #78c0e0;
        --border: #2a3441;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background:
          radial-gradient(ellipse 60% 50% at 50% -10%, rgba(120, 192, 224, 0.16), transparent 70%),
          var(--bg);
        color: var(--text);
      }

      main {
        width: min(28rem, 100%);
        padding: 2rem;
        border: 1px solid var(--border);
        border-radius: 1rem;
        background: color-mix(in srgb, var(--surface) 92%, transparent);
        text-align: center;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.5rem;
        font-weight: 650;
      }

      p {
        margin: 0 0 1.5rem;
        color: var(--muted);
        line-height: 1.55;
      }

      button {
        appearance: none;
        border: 0;
        border-radius: 0.75rem;
        padding: 0.7rem 1.1rem;
        background: var(--primary);
        color: #0b0f14;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        filter: brightness(1.05);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>
        Poyino can’t reach the network right now. Check your connection and try again. Cached pages
        may still be available.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
